<!DOCTYPE html>
<html lang="om">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Waliin-JM</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f4f7;
 color:#222;
}

body.dark{
 background:#121212;
 color:#eee;
}

header{
 background:#176b45;
 color:white;
 padding:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.container{
 max-width:900px;
 margin:auto;
 padding:15px;
}

.card{
 background:white;
 padding:18px;
 margin:12px 0;
 border-radius:15px;
 box-shadow:0 3px 12px #0001;
}

.dark .card{
 background:#1e1e1e;
}

input,button{
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:9px;
 font-size:16px;
}

input{
 border:1px solid #ccc;
}

button{
 border:0;
 background:#176b45;
 color:white;
}

button.danger{
 background:#c62828;
}

button.darkbtn{
 background:#444;
}

.hidden{
 display:none!important;
}

.videos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:10px;
}

video{
 width:100%;
 min-height:190px;
 background:#000;
 border-radius:12px;
}

.controls{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}

.chat{
 height:230px;
 overflow:auto;
 border:1px solid #ccc;
 padding:10px;
 border-radius:10px;
}

.msg{
 padding:8px;
 margin:5px 0;
 background:#e7f4ed;
 border-radius:8px;
}

.dark .msg{
 background:#303030;
}

.participant{
 display:flex;
 justify-content:space-between;
 padding:9px;
 border-bottom:1px solid #ddd;
}

@media(max-width:600px){

 .controls{
   grid-template-columns:1fr;
 }

 header h2{
   font-size:18px;
 }

}

</style>

</head>

<body>

<header>

<h2>🟢 Waliin-JM</h2>

<button
 class="darkbtn"
 onclick="toggleDark()"
 style="width:auto">
 🌙
</button>

</header>

<div class="container">

<!-- LOGIN -->

<div id="login" class="card">

<h2>Waliin-JM</h2>

<input
 id="username"
 placeholder="Maqaa kee">

<input
 id="createPassword"
 type="password"
 placeholder="Room password (optional)">

<button onclick="createRoom()">
➕ Room Uumi
</button>

<hr>

<input
 id="roomId"
 placeholder="Room ID">

<input
 id="joinPassword"
 type="password"
 placeholder="Room password">

<button onclick="joinRoom()">
🚪 Room Seeni
</button>

<p id="error"></p>

</div>


<!-- ROOM -->

<div id="room" class="hidden">

<div class="card">

<h2>
Room:
<span id="roomTitle"></span>
</h2>

<button onclick="copyRoom()">
🔗 Room ID Copy Godhi
</button>

</div>


<!-- VIDEO -->

<div class="card">

<h3>📹 Video Call</h3>

<div class="videos">

<video
 id="localVideo"
 autoplay
 muted
 playsinline>
</video>

<div id="remoteVideos"></div>

</div>

<div class="controls">

<button onclick="toggleMic()">
🎤 Mic
</button>

<button onclick="toggleCamera()">
📷 Camera
</button>

<button onclick="shareScreen()">
🖥️ Screen
</button>

<button
 class="danger"
 onclick="leaveRoom()">
 🚪 Ba'i
</button>

</div>

</div>


<!-- PARTICIPANTS -->

<div class="card">

<h3>👥 Participants</h3>

<div id="participants"></div>

</div>


<!-- CHAT -->

<div class="card">

<h3>💬 Chat</h3>

<div
 id="chat"
 class="chat">
</div>

<input
 id="message"
 placeholder="Ergaa barreessi..."
 onkeydown="
 if(event.key==='Enter') sendMessage()
 ">

<button onclick="sendMessage()">
📤 Ergi
</button>

</div>


<!-- SETTINGS -->

<div class="card">

<h3>⚙️ Settings</h3>

<button onclick="toggleDark()">
🌙 Dark / Light Mode
</button>

<button onclick="changeName()">
👤 Profile/Maqaa Jijjiiri
</button>

<button onclick="alert('Waliin-JM v2.0')">
ℹ️ About
</button>

</div>

</div>

</div>


<script>

const socket=io();

let username="";
let roomId="";
let localStream=null;

let peers={};


// CREATE ROOM

function createRoom(){

 username=document.getElementById("username").value.trim();

 const password=
 document.getElementById("createPassword").value;

 if(!username){

  alert("Maqaa kee galchi.");

  return;
 }

 socket.emit("create-room",{
  username,
  password
 });

}


// JOIN ROOM

function joinRoom(){

 username=
 document.getElementById("username").value.trim();

 roomId=
 document.getElementById("roomId").value.trim();

 const password=
 document.getElementById("joinPassword").value;

 if(!username||!roomId){

  alert("Maqaa fi Room ID galchi.");

  return;
 }

 socket.emit("join-room",{
  roomId,
  username,
  password
 });

}


// CREATED

socket.on("room-created",async data=>{

 roomId=data.roomId;

 openRoom();

 await startMedia();

});


// JOINED

socket.on("room-joined",async data=>{

 roomId=data.roomId;

 openRoom();

 await startMedia();

});


// ERROR

socket.on("room-error",msg=>{

 document.getElementById("error").innerText=msg;

 alert(msg);

});


// OPEN

function openRoom(){

 document.getElementById("login")
 .classList.add("hidden");

 document.getElementById("room")
 .classList.remove("hidden");

 document.getElementById("roomTitle")
 .innerText=roomId;

}


// MEDIA

async function startMedia(){

 try{

  localStream=
  await navigator.mediaDevices
  .getUserMedia({
   video:true,
   audio:true
  });

  document.getElementById("localVideo")
  .srcObject=localStream;

 }catch(e){

  alert("Camera/Mic hin argamne.");

 }

}


// MIC

function toggleMic(){

 if(!localStream)return;

 localStream.getAudioTracks()
 .forEach(t=>{
  t.enabled=!t.enabled;
 });

}


// CAMERA

function toggleCamera(){

 if(!localStream)return;

 localStream.getVideoTracks()
 .forEach(t=>{
  t.enabled=!t.enabled;
 });

}


// SCREEN

async function shareScreen(){

 try{

  const screen=
  await navigator.mediaDevices
  .getDisplayMedia({
   video:true
  });

  document.getElementById("localVideo")
  .srcObject=screen;

 }catch(e){}

}


// CHAT

function sendMessage(){

 const input=
 document.getElementById("message");

 const message=
 input.value.trim();

 if(!message)return;

 socket.emit("chat-message",{
  message
 });

 input.value="";

}


socket.on("chat-message",data=>{

 const chat=
 document.getElementById("chat");

 const div=
 document.createElement("div");

 div.className="msg";

 div.innerHTML=
 "<b>"+safe(data.username)+
 ":</b> "+
 safe(data.message);

 chat.appendChild(div);

 chat.scrollTop=chat.scrollHeight;

});


// TYPING

document
.getElementById("message")
.addEventListener("input",()=>{

 socket.emit("typing");

});


// PARTICIPANTS

socket.on("participants",users=>{

 const box=
 document.getElementById("participants");

 box.innerHTML="";

 users.forEach(user=>{

  const div=
  document.createElement("div");

  div.className="participant";

  div.innerHTML=
  "<span>👤 "+
  safe(user.username)+
  (user.isAdmin?" 👑":"")+
  "</span>";

  box.appendChild(div);

 });

});


// USER JOINED

socket.on("user-joined",async data=>{

 await createOffer(data.socketId);

});


// PEER

function makePeer(id){

 if(peers[id])return peers[id];

 const pc=
 new RTCPeerConnection({

  iceServers:[
   {
    urls:"stun:stun.l.google.com:19302"
   }
  ]

 });

 peers[id]=pc;

 if(localStream){

  localStream
  .getTracks()
  .forEach(track=>{
   pc.addTrack(track,localStream);
  });

 }

 pc.onicecandidate=e=>{

  if(e.candidate){

   socket.emit("ice-candidate",{
    target:id,
    candidate:e.candidate
   });

  }

 };

 pc.ontrack=e=>{

  let v=
  document.getElementById("remote-"+id);

  if(!v){

   v=document.createElement("video");

   v.id="remote-"+id;

   v.autoplay=true;
   v.playsInline=true;

   document
   .getElementById("remoteVideos")
   .appendChild(v);

  }

  v.srcObject=e.streams[0];

 };

 return pc;

}


// OFFER

async function createOffer(id){

 const pc=makePeer(id);

 const offer=
 await pc.createOffer();

 await pc.setLocalDescription(offer);

 socket.emit("offer",{
  target:id,
  offer
 });

}


// RECEIVE OFFER

socket.on("offer",async data=>{

 const pc=
 makePeer(data.sender);

 await pc.setRemoteDescription(
  new RTCSessionDescription(data.offer)
 );

 const answer=
 await pc.createAnswer();

 await pc.setLocalDescription(answer);

 socket.emit("answer",{
  target:data.sender,
  answer
 });

});


// ANSWER

socket.on("answer",async data=>{

 const pc=peers[data.sender];

 if(pc){

  await pc.setRemoteDescription(
   new RTCSessionDescription(data.answer)
  );

 }

});


// ICE

socket.on("ice-candidate",async data=>{

 const pc=peers[data.sender];

 if(!pc)return;

 try{

  await pc.addIceCandidate(
   new RTCIceCandidate(data.candidate)
  );

 }catch(e){}

});


// USER LEFT

socket.on("user-left",id=>{

 const v=
 document.getElementById("remote-"+id);

 if(v)v.remove();

 if(peers[id]){

  peers[id].close();

  delete peers[id];

 }

});


// COPY ROOM

function copyRoom(){

 navigator.clipboard.writeText(roomId);

 alert("Room ID copied.");

}


// DARK

function toggleDark(){

 document.body.classList.toggle("dark");

 localStorage.setItem(
  "dark",
  document.body.classList.contains("dark")
 );

}

if(localStorage.getItem("dark")==="true"){

 document.body.classList.add("dark");

}


// CHANGE NAME

function changeName(){

 const name=
 prompt("Maqaa haaraa galchi:",username);

 if(name){

  username=name;

  alert("Maqaan jijjiirame.");

 }

}


// LEAVE

function leaveRoom(){

 if(localStream){

  localStream
  .getTracks()
  .forEach(t=>t.stop());

 }

 location.reload();

}


// SECURITY

function safe(text){

 const div=
 document.createElement("div");

 div.textContent=text;

 return div.innerHTML;

}

</script>

</body>
  </html>
