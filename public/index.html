<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WALIIN JM</title>

  <meta name="theme-color" content="#087f5b">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #087f5b, #0ca678);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .logo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .auth-card h1 {
      text-align: center;
      margin: 5px 0;
      color: #087f5b;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #087f5b;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #e8f5ef;
      color: #087f5b;
      font-weight: bold;
      margin-top: 10px;
    }

    .link-btn {
      background: none;
      color: #087f5b;
      font-weight: bold;
      margin-top: 15px;
      width: 100%;
    }

    .error {
      color: #c92a2a;
      background: #fff5f5;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: center;
    }

    .success {
      color: #087f5b;
      background: #e8f5ef;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: center;
    }

    /* =========================
       APP
    ========================= */

    #appPage {
      min-height: 100vh;
    }

    .topbar {
      height: 62px;
      background: #087f5b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .avatar-small {
      width: 36px;
      height: 36px;
      background: white;
      color: #087f5b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .dashboard {
      padding: 18px;
      max-width: 1200px;
      margin: auto;
    }

    .welcome {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .welcome h2 {
      margin: 0 0 5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .card h3 {
      margin-top: 0;
      color: #087f5b;
    }

    .room-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 10px;
    }

    /* =========================
       ROOM
    ========================= */

    #roomPage {
      min-height: 100vh;
      background: #111;
      color: white;
    }

    .room-header {
      height: 58px;
      background: #087f5b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .room-id-box {
      background: rgba(255,255,255,.15);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .leave-btn {
      background: #c92a2a;
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
    }

    .room-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: calc(100vh - 58px);
    }

    .main-room {
      padding: 12px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .video-box {
      background: #222;
      border-radius: 12px;
      min-height: 170px;
      position: relative;
      overflow: hidden;
      border: 1px solid #333;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      min-height: 170px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .video-name {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(0,0,0,.65);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 2;
    }

    .side-panel {
      background: #181818;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      padding: 13px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .participants {
      padding: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .participant {
      background: #252525;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    .chat-area {
      flex: 1;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #333;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      margin-bottom: 9px;
    }

    .message strong {
      color: #69db7c;
    }

    .message-text {
      word-break: break-word;
    }

    .chat-form {
      display: flex;
      padding: 8px;
      gap: 6px;
    }

    .chat-form input {
      flex: 1;
      background: #252525;
      border: 1px solid #444;
      color: white;
      padding: 10px;
      border-radius: 8px;
    }

    .chat-form button {
      background: #087f5b;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,20,.94);
      padding: 9px;
      border-radius: 14px;
      display: flex;
      gap: 7px;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 95%;
    }

    .control-btn {
      min-width: 48px;
      padding: 10px;
      border-radius: 9px;
      background: #333;
      color: white;
    }

    .control-btn:hover {
      background: #444;
    }

    .control-btn.danger {
      background: #c92a2a;
    }

    .control-btn.green {
      background: #087f5b;
    }

    /* =========================
       SEATS
    ========================= */

    .seats-title {
      margin: 18px 0 10px;
      font-weight: bold;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin-bottom: 100px;
    }

    .seat {
      min-height: 65px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 9px;
      padding: 7px;
      text-align: center;
      font-size: 11px;
    }

    .seat.occupied {
      border-color: #087f5b;
      background: #123c30;
    }

    .seat.locked {
      background: #3b2020;
      border-color: #c92a2a;
    }

    .seat-number {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 11px 17px;
      border-radius: 9px;
      z-index: 200;
      display: none;
    }

    @media (max-width: 800px) {

      .room-layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        border-left: 0;
        border-top: 1px solid #333;
        min-height: 400px;
      }

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {

      .dashboard {
        padding: 10px;
      }

      .video-grid {
        grid-template-columns: 1fr 1fr;
      }

      .video-box {
        min-height: 130px;
      }

      .video-box video {
        min-height: 130px;
      }

      .controls {
        bottom: 6px;
      }

      .control-btn {
        min-width: 42px;
        padding: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     AUTH PAGE
========================= -->

<div id="authPage" class="auth-page">

  <div class="auth-card">

    <div class="logo">
      JM
    </div>

    <h1>WALIIN JM</h1>

    <div class="subtitle">
      Chat • Video • Classroom
    </div>

    <!-- LOGIN -->

    <div id="loginBox">

      <div id="loginMessage"></div>

      <div class="form-group">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="Email kee"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
        >
      </div>

      <button
        class="primary-btn"
        onclick="login()"
      >
        Seeni
      </button>

      <button
        class="link-btn"
        onclick="showSignup()"
      >
        Account haaraa uumi
      </button>

    </div>

    <!-- SIGNUP -->

    <div id="signupBox" class="hidden">

      <div id="signupMessage"></div>

      <div class="form-group">
        <label>Maqaa</label>
        <input
          id="signupUsername"
          type="text"
          placeholder="Maqaa kee"
        >
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          id="signupEmail"
          type="email"
          placeholder="Email kee"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
        >
      </div>

      <button
        class="primary-btn"
        onclick="signup()"
      >
        Account Uumi
      </button>

      <button
        class="link-btn"
        onclick="showLogin()"
      >
        Gara Login deebi'i
      </button>

    </div>

  </div>

</div>


<!-- =========================
     APP PAGE
========================= -->

<div id="appPage" class="hidden">

  <div class="topbar">

    <div class="brand">
      WALIIN JM
    </div>

    <div class="top-user">

      <div
        id="topUsername"
      >
        Guest
      </div>

      <div
        id="topAvatar"
        class="avatar-small"
      >
        G
      </div>

    </div>

  </div>

  <div class="dashboard">

    <div class="welcome">

      <h2>
        Baga nagaan dhuftan 👋
      </h2>

      <p>
        <span id="welcomeName">
          User
        </span>,
        WALIIN JM fayyadami.
      </p>

    </div>

    <div class="cards">

      <!-- CREATE ROOM -->

      <div class="card">

        <h3>
          🏠 Room Uumi
        </h3>

        <p>
          Classroom ykn video room haaraa uumi.
        </p>

        <input
          id="createPassword"
          class="room-input"
          type="password"
          placeholder="Room password (optional)"
        >

        <select
          id="seatCount"
          class="room-input"
        >
          <option value="10">
            10 Seats
          </option>

          <option value="15">
            15 Seats
          </option>
        </select>

        <button
          class="primary-btn"
          onclick="createRoom()"
        >
          Room Uumi
        </button>

      </div>


      <!-- JOIN ROOM -->

      <div class="card">

        <h3>
          🚪 Room Seeni
        </h3>

        <p>
          Room ID galchiitii seeni.
        </p>

        <input
          id="joinRoomId"
          class="room-input"
          placeholder="ROOM ID"
          maxlength="6"
        >

        <input
          id="joinPassword"
          class="room-input"
          type="password"
          placeholder="Room password"
        >

        <button
          class="primary-btn"
          onclick="joinRoom()"
        >
          Room Seeni
        </button>

      </div>


      <!-- PROFILE -->

      <div class="card">

        <h3>
          👤 Profile
        </h3>

        <p>
          Maqaa:
          <strong id="profileName">
            -
          </strong>
        </p>

        <p>
          Email:
          <strong id="profileEmail">
            -
          </strong>
        </p>

        <button
          class="secondary-btn"
          onclick="changeName()"
        >
          Maqaa Jijjiiri
        </button>

        <button
          class="secondary-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     ROOM PAGE
========================= -->

<div id="roomPage" class="hidden">

  <div class="room-header">

    <div>
      <strong>
        WALIIN JM
      </strong>
    </div>

    <div class="room-id-box">
      Room:
      <strong id="currentRoomId">
        ------
      </strong>
    </div>

    <button
      class="leave-btn"
      onclick="leaveRoom()"
    >
      Ba'i
    </button>

  </div>


  <div class="room-layout">

    <div class="main-room">

      <div
        id="videoGrid"
        class="video-grid"
      >

        <!-- LOCAL VIDEO -->

        <div
          id="localVideoBox"
          class="video-box"
        >

          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>

          <div class="video-name">
            Ati
          </div>

        </div>

      </div>


      <!-- SEATS -->

      <div class="seats-title">
        Seats
        (<span id="seatCountLabel">0</span>)
      </div>

      <div
        id="seats"
        class="seats"
      ></div>

    </div>


    <!-- SIDE PANEL -->

    <div class="side-panel">

      <div class="panel-title">
        👥 Participants
        (<span id="participantCount">0</span>)
      </div>

      <div
        id="participantsList"
        class="participants"
      ></div>


      <!-- CHAT -->

      <div class="chat-area">

        <div class="panel-title">
          💬 Chat
        </div>

        <div
          id="messages"
          class="messages"
        ></div>

        <div
          id="typingText"
          style="padding:0 10px;font-size:11px;color:#aaa;"
        ></div>

        <form
          class="chat-form"
          onsubmit="sendMessage(event)"
        >

          <input
            id="messageInput"
            placeholder="Ergaa barreessi..."
            autocomplete="off"
          >

          <button type="submit">
            Ergi
          </button>

        </form>

      </div>

    </div>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      id="micBtn"
      class="control-btn"
      onclick="toggleMic()"
    >
      🎤
    </button>

    <button
      id="cameraBtn"
      class="control-btn"
      onclick="toggleCamera()"
    >
      📹
    </button>

    <button
      class="control-btn"
      onclick="toggleHand()"
    >
      ✋
    </button>

    <button
      class="control-btn"
      onclick="shareScreen()"
    >
      🖥️
    </button>

    <button
      class="control-btn"
      onclick="startVideoCall()"
    >
      📞
    </button>

    <button
      class="control-btn"
      onclick="sendGift()"
    >
      🎁
    </button>

    <button
      class="control-btn"
      onclick="joinVoiceClub()"
    >
      🎙️
    </button>

    <button
      class="control-btn danger"
      onclick="leaveRoom()"
    >
      ❌
    </button>

  </div>

</div>


<div id="toast"></div>


<!-- SOCKET.IO -->

<script src="/socket.io/socket.io.js"></script>

<script>

  /* =========================
     VARIABLES
  ========================= */

  let socket = null;

  let currentUser = null;

  let roomId = null;

  let localStream = null;

  let screenStream = null;

  let peers = {};

  let cameraOn = true;

  let micOn = false;

  let handRaised = false;

  let voiceClubJoined = false;


  /* =========================
     HELPERS
  ========================= */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      String(text ?? "");

    return div.innerHTML;
  }


  function toast(message) {

    const box =
      document.getElementById("toast");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 2500);
  }


  function showLogin() {

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document
      .getElementById("signupBox")
      .classList.add("hidden");
  }


  function showSignup() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("signupBox")
      .classList.remove("hidden");
  }


  /* =========================
     SIGNUP
  ========================= */

  async function signup() {

    const username =
      document
        .getElementById("signupUsername")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;

    const message =
      document.getElementById(
        "signupMessage"
      );

    if (!username || !email || !password) {

      message.innerHTML =
        `<div class="error">
          Maaloo odeeffannoo guuti.
        </div>`;

      return;
    }

    try {

      const response =
        await fetch("/api/signup", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username,
            email,
            password
          })

        });

      const data =
        await response.json();

      if (!data.success) {

        message.innerHTML =
          `<div class="error">
            ${escapeHtml(
              data.message ||
              "Signup hin milkoofne."
            )}
          </div>`;

        return;
      }

      message.innerHTML =
        `<div class="success">
          Account uumameera.
        </div>`;

      setTimeout(() => {

        document.getElementById(
          "loginEmail"
        ).value = email;

        showLogin();

      }, 700);

    } catch (error) {

      message.innerHTML =
        `<div class="error">
          Server waliin wal qunnamuun hin danda'amne.
        </div>`;

      console.error(error);
    }
  }


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    const message =
      document.getElementById(
        "loginMessage"
      );

    if (!email || !password) {

      message.innerHTML =
        `<div class="error">
          Email fi password guuti.
        </div>`;

      return;
    }

    try {

      const response =
        await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })

        });

      const data =
        await response.json();

      if (!data.success) {

        message.innerHTML =
          `<div class="error">
            ${escapeHtml(
              data.message ||
              "Login hin milkoofne."
            )}
          </div>`;

        return;
      }

      currentUser =
        data.user;

      localStorage.setItem(
        "waliinUser",
        JSON.stringify(
          currentUser
        )
      );

      openApp();

    } catch (error) {

      console.error(error);

      message.innerHTML =
        `<div class="error">
          Server waliin wal qunnamuun hin danda'amne.
        </div>`;
    }
  }


  /* =========================
     OPEN APP
  ========================= */

  function openApp() {

    document
      .getElementById("authPage")
      .classList.add("hidden");

    document
      .getElementById("roomPage")
      .classList.add("hidden");

    document
      .getElementById("appPage")
      .classList.remove("hidden");

    updateProfile();
  }


  function updateProfile() {

    if (!currentUser) return;

    const name =
      currentUser.username ||
      "User";

    document.getElementById(
      "topUsername"
    ).textContent = name;

    document.getElementById(
      "welcomeName"
    ).textContent = name;

    document.getElementById(
      "profileName"
    ).textContent = name;

    document.getElementById(
      "profileEmail"
    ).textContent =
      currentUser.email || "";

    document.getElementById(
      "topAvatar"
    ).textContent =
      name.charAt(0).toUpperCase();
  }


  /* =========================
     SOCKET
  ========================= */

  function connectSocket() {

    if (socket) return;

    socket = io();

    socket.on(
      "connect",
      () => {

        console.log(
          "Socket connected:",
          socket.id
        );
      }
    );

    socket.on(
      "connect_error",
      error => {

        console.error(
          "Socket error:",
          error
        );

        toast(
          "Socket server waliin wal qunnamuu hin dandeenye."
        );
      }
    );


    /* CLASSROOM STATE */

    socket.on(
      "classroom-state",
      state => {

        console.log(
          "Classroom:",
          state
        );

        renderParticipants(
          state.participants || []
        );

        renderSeats(
          state.seats || []
        );

        document.getElementById(
          "participantCount"
        ).textContent =
          (state.participants || [])
            .length;

        document.getElementById(
          "seatCountLabel"
        ).textContent =
          state.seatCount || 0;
      }
    );


    /* USER JOINED */

    socket.on(
      "user-joined",
      async data => {

        if (!data?.socketId) return;

        try {

          await createOffer(
            data.socketId
          );

        } catch (error) {

          console.error(
            "Offer error:",
            error
          );
        }
      }
    );


    /* OFFER */

    socket.on(
      "offer",
      async data => {

        try {

          await handleOffer(
            data.sender,
            data.offer
          );

        } catch (error) {

          console.error(
            "Offer handling error:",
            error
          );
        }
      }
    );


    /* ANSWER */

    socket.on(
      "answer",
      async data => {

        try {

          if (
            peers[data.sender]
          ) {

            await peers[
              data.sender
            ].setRemoteDescription(
              new RTCSessionDescription(
                data.answer
              )
            );
          }

        } catch (error) {

          console.error(
            "Answer error:",
            error
          );
        }
      }
    );


    /* ICE */

    socket.on(
      "ice-candidate",
      async data => {

        try {

          if (
            peers[data.sender] &&
            data.candidate
          ) {

            await peers[
              data.sender
            ].addIceCandidate(
              new RTCIceCandidate(
                data.candidate
              )
            );
          }

        } catch (error) {

          console.error(
            "ICE error:",
            error
          );
        }
      }
    );


    /* USER LEFT */

    socket.on(
      "user-left",
      data => {

        const id =
          typeof data === "string"
            ? data
            : data?.socketId;

        if (!id) return;

        const video =
          document.getElementById(
            "remote-" + id
          );

        if (video) {
          video.remove();
        }

        if (peers[id]) {

          try {
            peers[id].close();
          } catch (e) {}

          delete peers[id];
        }
      }
    );


    /* CHAT */

    socket.on(
      "chat-message",
      message => {

        addMessage(
          message
        );
      }
    );


    /* TYPING */

    socket.on(
      "typing",
      data => {

        const typing =
          document.getElementById(
            "typingText"
          );

        typing.textContent =
          `${data.username || "User"} barreessaa jira...`;

        clearTimeout(
          window.typingTimer
        );

        window.typingTimer =
          setTimeout(() => {

            typing.textContent = "";

          }, 1500);
      }
    );


    /* FORCE MUTE */

    socket.on(
      "force-mute",
      () => {

        micOn = false;

        if (localStream) {

          localStream
            .getAudioTracks()
            .forEach(
              track =>
                track.enabled = false
            );
        }

        updateMicButton();

        toast(
          "Host mic kee cufe."
        );
      }
    );


    /* UNMUTED */

    socket.on(
      "unmuted-by-host",
      () => {

        toast(
          "Host mic kee banaa godhe."
        );
      }
    );


    /* REMOVED */

    socket.on(
      "removed-from-room",
      () => {

        toast(
          "Room keessaa baafamte."
        );

        leaveRoom();
      }
    );


    /* CALL */

    socket.on(
      "call-started",
      data => {

        toast(
          `Call ${data.type || "video"} jalqabame.`
        );
      }
    );


    socket.on(
      "call-ended",
      () => {

        toast(
          "Call xumurame."
        );
      }
    );


    /* GIFTS */

    socket.on(
      "giftReceived",
      gift => {

        toast(
          `🎁 ${gift.from} gift erge!`
        );
      }
    );


    /* VOICE CLUB */

    socket.on(
      "voice-club-state",
      users => {

        toast(
          `🎙️ Voice Club: ${users.length} nama`
        );
      }
    );
  }


  /* =========================
     CREATE ROOM
  ========================= */

  function createRoom() {

    if (!currentUser) {

      toast(
        "Dura login godhi."
      );

      return;
    }

    connectSocket();

    const password =
      document.getElementById(
        "createPassword"
      ).value;

    const seatCount =
      Number(
        document.getElementById(
          "seatCount"
        ).value
      );

    socket.emit(
      "create-room",
      {
        username:
          currentUser.username,

        password,

        type: "classroom",

        seatCount
      },
      async response => {

        if (!response?.success) {

          toast(
            response?.message ||
            "Room uumuu hin dandeenye."
          );

          return;
        }

        roomId =
          response.roomId;

        document.getElementById(
          "currentRoomId"
        ).textContent =
          roomId;

        openRoom();

        await startMedia();
      }
    );
  }


  /* =========================
     JOIN ROOM
  ========================= */

  function joinRoom() {

    if (!currentUser) {

      toast(
        "Dura login godhi."
      );

      return;
    }

    const input =
      document.getElementById(
        "joinRoomId"
      );

    const room =
      input.value
        .trim()
        .toUpperCase();

    const password =
      document.getElementById(
        "joinPassword"
      ).value;

    if (!room) {

      toast(
        "Room ID galchi."
      );

      return;
    }

    connectSocket();

    socket.emit(
      "join-room",
      {
        roomId: room,
        username:
          currentUser.username,
        password
      },
      async response => {

        if (!response?.success) {

          toast(
            response?.message ||
            "Room seenuu hin dandeenye."
          );

          return;
        }

        roomId =
          response.roomId;

        document.getElementById(
          "currentRoomId"
        ).textContent =
          roomId;

        openRoom();

        await startMedia();
      }
    );
  }


  /* =========================
     OPEN ROOM
  ========================= */

  function openRoom() {

    document
      .getElementById("appPage")
      .classList.add("hidden");

    document
      .getElementById("authPage")
      .classList.add("hidden");

    document
      .getElementById("roomPage")
      .classList.remove("hidden");
  }


  /* =========================
     MEDIA
  ========================= */

  async function startMedia() {

    try {

      localStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true,
            audio: true
          });

      const video =
        document.getElementById(
          "localVideo"
        );

      video.srcObject =
        localStream;

      cameraOn = true;
      micOn = true;

      updateMicButton();

    } catch (error) {

      console.error(
        "Media error:",
        error
      );

      toast(
        "Camera ykn microphone eeyyama gaafata."
      );
    }
  }


  /* =========================
     PEER
  ========================= */

  function makePeer(userId) {

    if (peers[userId]) {

      return peers[userId];
    }

    const peer =
      new RTCPeerConnection({

        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          },
          {
            urls:
              "stun:stun1.l.google.com:19302"
          }
        ]

      });


    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track => {

            peer.addTrack(
              track,
              localStream
            );

          }
        );
    }


    peer.onicecandidate =
      event => {

        if (
          event.candidate &&
          socket
        ) {

          socket.emit(
            "ice-candidate",
            {
              target: userId,
              candidate:
                event.candidate
            }
          );
        }
      };


    peer.ontrack =
      event => {

        addRemoteVideo(
          userId,
          event.streams[0]
        );
      };


    peer.onconnectionstatechange =
      () => {

        if (
          peer.connectionState ===
            "failed" ||
          peer.connectionState ===
            "closed" ||
          peer.connectionState ===
            "disconnected"
        ) {

          removeRemoteVideo(
            userId
          );
        }
      };


    peers[userId] =
      peer;

    return peer;
  }


  /* =========================
     CREATE OFFER
  ========================= */

  async function createOffer(
    userId
  ) {

    const peer =
      makePeer(userId);

    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );

    socket.emit(
      "offer",
      {
        target: userId,
        offer
      }
    );
  }


  /* =========================
     HANDLE OFFER
  ========================= */

  async function handleOffer(
    userId,
    offer
  ) {

    const peer =
      makePeer(userId);

    await peer.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    const answer =
      await peer.createAnswer();

    await peer.setLocalDescription(
      answer
    );

    socket.emit(
      "answer",
      {
        target: userId,
        answer
      }
    );
  }


  /* =========================
     REMOTE VIDEO
  ========================= */

  function addRemoteVideo(
    userId,
    stream
  ) {

    let box =
      document.getElementById(
        "remote-box-" + userId
      );

    if (!box) {

      box =
        document.createElement(
          "div"
        );

      box.className =
        "video-box";

      box.id =
        "remote-box-" + userId;


      const video =
        document.createElement(
          "video"
        );

      video.id =
        "remote-" + userId;

      video.autoplay = true;
      video.playsInline = true;

      box.appendChild(
        video
      );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "video-name";

      name.textContent =
        "Participant";

      box.appendChild(
        name
      );


      document
        .getElementById(
          "videoGrid"
        )
        .appendChild(box);
    }

    const video =
      document.getElementById(
        "remote-" + userId
      );

    if (video) {

      video.srcObject =
        stream;
    }
  }


  function removeRemoteVideo(
    userId
  ) {

    const box =
      document.getElementById(
        "remote-box-" + userId
      );

    if (box) {
      box.remove();
    }
  }


  /* =========================
     MIC
  ========================= */

  function toggleMic() {

    if (!localStream) {

      toast(
        "Microphone hin jalqabne."
      );

      return;
    }

    const audioTracks =
      localStream.getAudioTracks();

    if (!audioTracks.length) {

      toast(
        "Microphone hin argamne."
      );

      return;
    }

    micOn = !micOn;

    audioTracks.forEach(
      track =>
        track.enabled = micOn
    );

    if (socket) {

      socket.emit(
        "toggle-mic",
        response => {

          if (
            response &&
            !response.success
          ) {

            toast(
              response.message
            );
          }
        }
      );
    }

    updateMicButton();
  }


  function updateMicButton() {

    const button =
      document.getElementById(
        "micBtn"
      );

    if (!button) return;

    button.textContent =
      micOn ? "🎤" : "🔇";
  }


  /* =========================
     CAMERA
  ========================= */

  function toggleCamera() {

    if (!localStream) return;

    const tracks =
      localStream.getVideoTracks();

    if (!tracks.length) return;

    cameraOn = !cameraOn;

    tracks.forEach(
      track =>
        track.enabled =
          cameraOn
    );

    document.getElementById(
      "cameraBtn"
    ).textContent =
      cameraOn
        ? "📹"
        : "🚫";
  }


  /* =========================
     HAND
  ========================= */

  function toggleHand() {

    if (!socket) return;

    socket.emit(
      "raise-hand",
      response => {

        if (!response?.success)
          return;

        handRaised =
          response.handRaised;

        toast(
          handRaised
            ? "✋ Harka kaase."
            : "Harka gadi buufte."
        );
      }
    );
  }


  /* =========================
     SCREEN SHARE
  ========================= */

  async function shareScreen() {

    try {

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video: true
          });

      const screenTrack =
        screenStream.getVideoTracks()[0];

      const localVideo =
        document.getElementById(
          "localVideo"
        );

      localVideo.srcObject =
        screenStream;


      Object.values(peers)
        .forEach(peer => {

          const sender =
            peer
              .getSenders()
              .find(
                s =>
                  s.track &&
                  s.track.kind ===
                    "video"
              );

          if (sender) {

            sender.replaceTrack(
              screenTrack
            );
          }
        });


      screenTrack.onended =
        async () => {

          if (!localStream)
            return;

          const cameraTrack =
            localStream
              .getVideoTracks()[0];

          if (!cameraTrack)
            return;

          localVideo.srcObject =
            localStream;

          Object.values(peers)
            .forEach(peer => {

              const sender =
                peer
                  .getSenders()
                  .find(
                    s =>
                      s.track &&
                      s.track.kind ===
                        "video"
                  );

              if (sender) {

                sender.replaceTrack(
                  cameraTrack
                );
              }
            });
        };

    } catch (error) {

      console.error(
        "Screen share:",
        error
      );
    }
  }


  /* =========================
     VIDEO CALL
  ========================= */

  function startVideoCall() {

    if (!socket) return;

    socket.emit(
      "call-start",
      {
        type: "video"
      }
    );

    toast(
      "📞 Video call jalqabame."
    );
  }


  /* =========================
     VOICE CLUB
  ========================= */

  function joinVoiceClub() {

    if (!socket) return;

    if (!voiceClubJoined) {

      socket.emit(
        "voice-club-join",
        response => {

          if (
            response?.success
          ) {

            voiceClubJoined =
              true;

            toast(
              "🎙️ Voice Club seente."
            );
          }
        }
      );

    } else {

      socket.emit(
        "voice-club-leave",
        response => {

          voiceClubJoined =
            false;

          toast(
            "Voice Club keessaa baate."
          );
        }
      );
    }
  }


  /* =========================
     GIFT
  ========================= */

  function sendGift() {

    if (!socket) return;

    socket.emit(
      "sendGift",
      {
        type: "heart",
        amount: 1
      }
    );
  }


  /* =========================
     CHAT
  ========================= */

  function sendMessage(event) {

    event.preventDefault();

    const input =
      document.getElementById(
        "messageInput"
      );

    const message =
      input.value.trim();

    if (!message) return;

    if (!socket) return;

    socket.emit(
      "chat-message",
      {
        message
      }
    );

    input.value = "";
  }


  function addMessage(
    message
  ) {

    const box =
      document.getElementById(
        "messages"
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "message";

    div.innerHTML = `
      <strong>
        ${escapeHtml(
          message.username
        )}
      </strong>
      <div class="message-text">
        ${escapeHtml(
          message.message
        )}
      </div>
    `;

    box.appendChild(
      div
    );

    box.scrollTop =
      box.scrollHeight;
  }


  document.addEventListener(
    "input",
    event => {

      if (
        event.target.id !==
        "messageInput"
      ) return;

      if (!socket) return;

      socket.emit(
        "typing",
        {
          username:
            currentUser?.username ||
            "User"
        }
      );
    }
  );


  /* =========================
     PARTICIPANTS
  ========================= */

  function renderParticipants(
    users
  ) {

    const list =
      document.getElementById(
        "participantsList"
      );

    list.innerHTML = "";

    users.forEach(user => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "participant";

      const left =
        document.createElement(
          "span"
        );

      left.innerHTML =
        `<strong>
          ${escapeHtml(
            user.username
          )}
        </strong>`;

      const right =
        document.createElement(
          "span"
        );

      right.textContent =
        (
          user.role || ""
        ) +
        (
          user.micOn
            ? " 🎤"
            : " 🔇"
        ) +
        (
          user.handRaised
            ? " ✋"
            : ""
        );

      div.appendChild(left);
      div.appendChild(right);

      list.appendChild(div);
    });
  }


  /* =========================
     SEATS
  ========================= */

  function renderSeats(
    seats
  ) {

    const container =
      document.getElementById(
        "seats"
      );

    container.innerHTML = "";

    seats.forEach(seat => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "seat";

      if (seat.socketId) {
        div.classList.add(
          "occupied"
        );
      }

      if (seat.locked) {
        div.classList.add(
          "locked"
        );
      }

      div.innerHTML = `
        <span class="seat-number">
          Seat ${seat.number}
        </span>
        <span>
          ${
            seat.locked
              ? "🔒 Locked"
              : seat.username
                ? escapeHtml(
                    seat.username
                  )
                : "Duwwaa"
          }
        </span>
        ${
          seat.micOn
            ? "<br>🎤"
            : ""
        }
      `;

      container.appendChild(
        div
      );
    });
  }


  /* =========================
     CHANGE NAME
  ========================= */

  function changeName() {

    if (!currentUser) return;

    const name =
      prompt(
        "Maqaa haaraa galchi:",
        currentUser.username
      );

    if (!name) return;

    currentUser.username =
      name.trim();

    localStorage.setItem(
      "waliinUser",
      JSON.stringify(
        currentUser
      )
    );

    updateProfile();

    toast(
      "Maqaan jijjiirame."
    );
  }


  /* =========================
     LEAVE ROOM
  ========================= */

  function leaveRoom() {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      localStream = null;
    }

    if (screenStream) {

      screenStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      screenStream = null;
    }

    Object.values(peers)
      .forEach(peer => {

        try {
          peer.close();
        } catch (e) {}

      });

    peers = {};

    document.getElementById(
      "videoGrid"
    ).innerHTML = `
      <div
        id="localVideoBox"
        class="video-box"
      >
        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="video-name">
          Ati
        </div>
      </div>
    `;

    if (socket) {

      socket.disconnect();

      socket = null;
    }

    roomId = null;

    micOn = false;
    cameraOn = true;
    handRaised = false;
    voiceClubJoined = false;

    document
      .getElementById("roomPage")
      .classList.add("hidden");

    document
      .getElementById("appPage")
      .classList.remove("hidden");
  }


  /* =========================
     LOGOUT
  ========================= */

  function logout() {

    if (socket) {

      try {
        socket.disconnect();
      } catch (e) {}

      socket = null;
    }

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }

    localStorage.removeItem(
      "waliinUser"
    );

    currentUser = null;

    document
      .getElementById("appPage")
      .classList.add("hidden");

    document
      .getElementById("roomPage")
      .classList.add("hidden");

    document
      .getElementById("authPage")
      .classList.remove("hidden");

    showLogin();
  }


  /* =========================
     AUTO LOGIN
  ========================= */

  window.addEventListener(
    "load",
    () => {

      const saved =
        localStorage.getItem(
          "waliinUser"
        );

      if (saved) {

        try {

          currentUser =
            JSON.parse(saved);

          openApp();

        } catch (error) {

          localStorage.removeItem(
            "waliinUser"
          );

          showLogin();
        }

      } else {

        showLogin();
      }
    }
  );

</script>
