<!DOCTYPE html>
<html lang="om">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#176b45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Waliin-JM</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f4f7;
 color:#222;
}

body.dark{
 background:#121212;
 color:#eee;
}

header{
 background:#176b45;
 color:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.container{
 max-width:900px;
 margin:auto;
 padding:15px;
}

.card{
 background:white;
 padding:20px;
 margin:15px 0;
 border-radius:15px;
 box-shadow:0 3px 12px #0002;
}

.dark .card{
 background:#1e1e1e;
}

input,button{
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:9px;
 font-size:16px;
}

input{
 border:1px solid #ccc;
}

button{
 border:0;
 background:#176b45;
 color:white;
 cursor:pointer;
}

button:hover{
 opacity:.9;
}

.darkbtn{
 background:#444;
}

.danger{
 background:#c62828;
}

.hidden{
 display:none!important;
}

.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 margin-bottom:15px;
}

.tabs button{
 background:#ddd;
 color:#222;
}

.tabs button.active{
 background:#176b45;
 color:white;
}

.error{
 color:#c62828;
 font-weight:bold;
}

.success{
 color:#176b45;
 font-weight:bold;
}

.videos{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(240px,1fr));
 gap:10px;
}

video{
 width:100%;
 min-height:190px;
 background:#000;
 border-radius:12px;
}

.controls{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}

.chat{
 height:230px;
 overflow:auto;
 border:1px solid #ccc;
 padding:10px;
 border-radius:10px;
}

.msg{
 padding:8px;
 margin:5px 0;
 background:#e7f4ed;
 border-radius:8px;
}

.dark .msg{
 background:#303030;
}

.participant{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:9px;
 border-bottom:1px solid #ddd;
}

.small{
 font-size:13px;
 opacity:.7;
}

/* GIFT */

.gift-grid{
 display:grid;
 grid-template-columns:
 repeat(5,1fr);
 gap:6px;
}

.gift-btn{
 font-size:25px;
 padding:12px 5px;
 background:#176b45;
}

#giftArea{
 min-height:10px;
}

.gift-item{
 padding:10px;
 margin:6px 0;
 border-radius:10px;
 background:#fff3cd;
 animation:giftIn .3s ease;
}

.dark .gift-item{
 background:#3b321c;
}

@keyframes giftIn{
 from{
  transform:scale(.7);
  opacity:0;
 }
 to{
  transform:scale(1);
  opacity:1;
 }
}

/* VOICE CLUB */

.voice-buttons{
 display:grid;
 grid-template-columns:
 repeat(2,1fr);
 gap:7px;
}

.voice-status{
 padding:12px;
 border-radius:10px;
 background:#e7f4ed;
 margin-bottom:10px;
}

.dark .voice-status{
 background:#303030;
}

@media(max-width:600px){

 .controls{
   grid-template-columns:1fr;
 }

 .gift-grid{
   grid-template-columns:
   repeat(3,1fr);
 }

 .voice-buttons{
   grid-template-columns:1fr;
 }

}
</style>
</head>

<body>

</button>

 💎
</button>

<script>

const socket = io();

let currentUser =
 JSON.parse(
  localStorage.getItem("waliinUser")
 );

let username = "";
let roomId = "";
let localStream = null;
let peers = {};
let voiceClubActive = false;
let coins = 1000;


/* AUTH START */

if(currentUser){
 showApp();

 if(currentUser.coins !== undefined){
  coins = currentUser.coins;
 }

 updateCoins();
}


/* LOGIN TAB */

function showLogin(){

 document.getElementById("loginForm")
 .classList.remove("hidden");

 document.getElementById("signupForm")
 .classList.add("hidden");

 document.getElementById("loginTab")
 .classList.add("active");

 document.getElementById("signupTab")
 .classList.remove("active");
}


/* SIGNUP TAB */

function showSignup(){

 document.getElementById("loginForm")
 .classList.add("hidden");

 document.getElementById("signupForm")
 .classList.remove("hidden");

 document.getElementById("loginTab")
 .classList.remove("active");

 document.getElementById("signupTab")
 .classList.add("active");
}


/* SIGNUP */

async function signup(){

 const username =
 document.getElementById(
  "signupUsername"
 ).value.trim();

 const email =
 document.getElementById(
  "signupEmail"
 ).value.trim();

 const password =
 document.getElementById(
  "signupPassword"
 ).value;

 if(!username || !email || !password){

  showAuthMessage(
   "Odeeffannoo hunda guuti.",
   false
  );

  return;
 }

 try{

  const response =
   await fetch("/api/signup",{

    method:"POST",

    headers:{
     "Content-Type":
     "application/json"
    },

    body:JSON.stringify({
     username,
     email,
     password
    })

   });

  const data =
   await response.json();

  showAuthMessage(
   data.message,
   data.success
  );

  if(data.success){

   showLogin();

   document.getElementById(
    "loginEmail"
   ).value=email;

  }

 }catch(error){

  showAuthMessage(
   "Server waliin wal qunnamuun hin danda'amne.",
   false
  );

 }
}


/* LOGIN */

async function login(){

 const email =
 document.getElementById(
  "loginEmail"
 ).value.trim();

 const password =
 document.getElementById(
  "loginPassword"
 ).value;

 if(!email || !password){

  showAuthMessage(
   "Email fi password guuti.",
   false
  );

  return;
 }

 try{

  const response =
   await fetch("/api/login",{

    method:"POST",

    headers:{
     "Content-Type":
     "application/json"
    },

    body:JSON.stringify({
     email,
     password
    })

   });

  const data =
   await response.json();

  if(!data.success){

   showAuthMessage(
    data.message,
    false
   );

   return;
  }

  currentUser=data.user;

  if(currentUser.coins !== undefined){
   coins=currentUser.coins;
  }

  localStorage.setItem(
   "waliinUser",
   JSON.stringify(currentUser)
  );

  showApp();

 }catch(error){

  showAuthMessage(
   "Server waliin wal qunnamuun hin danda'amne.",
   false
  );

 }
}


/* SHOW APP */

function showApp(){

 document.getElementById("auth")
 .classList.add("hidden");

 document.getElementById("app")
 .classList.remove("hidden");

 document.getElementById(
  "profileName"
 ).innerText =
 currentUser.username;

 document.getElementById(
  "username"
 ).value =
 currentUser.username;

 updateCoins();
}


/* MESSAGE */

function showAuthMessage(
 message,
 success
){

 const box =
 document.getElementById(
  "authMessage"
 );

 box.innerText=message;

 box.className =
 success ? "success" : "error";
}


/* LOGOUT */

function logout(){

 if(localStream){

  localStream
  .getTracks()
  .forEach(track=>{
   track.stop();
  });

 }

 localStorage.removeItem(
  "waliinUser"
 );

 location.reload();
}


/* CREATE ROOM */

function createRoom(){

 username =
 document.getElementById(
  "username"
 ).value.trim();

 const password =
 document.getElementById(
  "createPassword"
 ).value;

 if(!username){

  alert("Maqaa kee galchi.");

  return;
 }

 socket.emit(
  "create-room",
  {
   username,
   password,
   type:"video"
  }
 );
}


/* JOIN ROOM */

function joinRoom(){

 username =
 document.getElementById(
  "username"
 ).value.trim();

 roomId =
 document.getElementById(
  "roomId"
 ).value.trim()
 .toUpperCase();

 const password =
 document.getElementById(
  "joinPassword"
 ).value;

 if(!username || !roomId){

  alert(
   "Maqaa fi Room ID galchi."
  );

  return;
 }

 socket.emit(
  "join-room",
  {
   roomId,
   username,
   password
  }
 );
}


/* CREATED */

socket.on(
 "room-created",
 async data=>{

  roomId=data.roomId;

  openRoom();

  await startMedia();
 }
);


/* JOINED */

socket.on(
 "room-joined",
 async data=>{

  roomId=data.roomId;

  openRoom();

  await startMedia();

 }
);


/* ERROR */

socket.on(
 "room-error",
 msg=>{

  document.getElementById(
   "roomError"
  ).innerText=msg;

  alert(msg);
 }
);


/* OPEN ROOM */

function openRoom(){

 document.getElementById(
  "roomLogin"
 ).classList.add("hidden");

 document.getElementById(
  "room"
 ).classList.remove("hidden");

 document.getElementById(
  "roomTitle"
 ).innerText=roomId;
}


/* MEDIA */

async function startMedia(){

 try{

  localStream =
   await navigator.mediaDevices
   .getUserMedia({
    video:true,
    audio:true
   });

  document.getElementById(
   "localVideo"
  ).srcObject=localStream;

 }catch(error){

  alert(
   "Camera/Mic hin argamne. Permission kenni."
  );

 }
}


/* MIC */

function toggleMic(){

 if(!localStream)return;

 localStream
 .getAudioTracks()
 .forEach(track=>{
  track.enabled =
   !track.enabled;
 });
}


/* CAMERA */

function toggleCamera(){

 if(!localStream)return;

 localStream
 .getVideoTracks()
 .forEach(track=>{
  track.enabled =
   !track.enabled;
 });
}


/* SCREEN */

async function shareScreen(){

 try{

  const screen =
   await navigator.mediaDevices
   .getDisplayMedia({
    video:true
   });

  document.getElementById(
   "localVideo"
  ).srcObject=screen;

 }catch(error){}

}


/* START VIDEO CALL */

function startVideoCall(){

 const users =
  document.querySelectorAll(
   ".participant"
  );

 if(!roomId){

  alert("Dura room seeni.");

  return;
 }

 alert(
  "Call jalqabameera. Namoota room keessa jiran waliin video call qindeessaa jira."
 );
}


/* CHAT */

function sendMessage(){

 const input =
  document.getElementById(
   "message"
  );

 const message =
  input.value.trim();

 if(!message)return;

 socket.emit(
  "chat-message",
  {message}
 );

 input.value="";
}


socket.on(
 "chat-message",
 data=>{

  const chat =
   document.getElementById(
    "chat"
   );

  const div =
   document.createElement(
    "div"
   );

  div.className="msg";

  div.innerHTML =
   "<b>"+
   safe(data.username)+
   ":</b> "+
   safe(data.message);

  chat.appendChild(div);

  chat.scrollTop =
   chat.scrollHeight;

 }
);


/* TYPING */

document
.getElementById("message")
.addEventListener(
 "input",
 ()=>{
  socket.emit("typing");
 }
);


socket.on(
 "typing",
 data=>{

  const box =
   document.getElementById(
    "typing"
   );

  box.innerText =
   data.username+
   " barreessaa jira...";

  clearTimeout(
   window.typingTimer
  );

  window.typingTimer =
   setTimeout(()=>{
    box.innerText="";
   },1500);
 }
);


/* PARTICIPANTS */

socket.on(
 "participants",
 users=>{

  const box =
   document.getElementById(
    "participants"
   );

  box.innerHTML="";

  document.getElementById(
   "count"
  ).innerText=users.length;

  users.forEach(user=>{

   const div =
    document.createElement(
     "div"
    );

   div.className=
    "participant";

   let html =
    "<span>👤 "+
    safe(user.username);

   if(user.isAdmin){
    html+=" 👑";
   }

   html+="</span>";

   div.innerHTML=html;

   box.appendChild(div);

  });
 }
);


/* USER JOINED */

socket.on(
 "user-joined",
 async data=>{

  await createOffer(
   data.socketId
  );

 }
);


/* PEER */

function makePeer(id){

 if(peers[id])
  return peers[id];

 const pc =
  new RTCPeerConnection({

   iceServers:[
    {
     urls:
      "stun:stun.l.google.com:19302"
    }
   ]

  });

 peers[id]=pc;

 if(localStream){

  localStream
  .getTracks()
  .forEach(track=>{
   pc.addTrack(
    track,
    localStream
   );
  });
 }

 pc.onicecandidate =
  event=>{

   if(event.candidate){

    socket.emit(
     "ice-candidate",
     {
      target:id,
      candidate:
       event.candidate
     }
    );
   }
  };

 pc.ontrack =
  event=>{

   let video =
    document.getElementById(
     "remote-"+id
    );

   if(!video){

    video =
     document.createElement(
      "video"
     );

    video.id =
     "remote-"+id;

    video.autoplay=true;
    video.playsInline=true;

    document
    .getElementById(
     "remoteVideos"
    )
    .appendChild(video);
   }

   video.srcObject =
    event.streams[0];
  };

 return pc;
}


/* OFFER */

async function createOffer(id){

 const pc =
  makePeer(id);

 const offer =
  await pc.createOffer();

 await pc.setLocalDescription(
  offer
 );

 socket.emit(
  "offer",
  {
   target:id,
   offer
  }
 );
}


/* RECEIVE OFFER */

socket.on(
 "offer",
 async data=>{

  const pc =
   makePeer(data.sender);

  await pc.setRemoteDescription(
   new RTCSessionDescription(
    data.offer
   )
  );

  const answer =
   await pc.createAnswer();

  await pc.setLocalDescription(
   answer
  );

  socket.emit(
   "answer",
   {
    target:data.sender,
    answer
   }
  );
 }
);


/* ANSWER */

socket.on(
 "answer",
 async data=>{

  const pc =
   peers[data.sender];

  if(pc){

   await pc.setRemoteDescription(
    new RTCSessionDescription(
     data.answer
    )
   );
  }
 }
);


/* ICE */

socket.on(
 "ice-candidate",
 async data=>{

  const pc =
   peers[data.sender];

  if(!pc)return;

  try{

   await pc.addIceCandidate(
    new RTCIceCandidate(
     data.candidate
    )
   );

  }catch(error){}
 }
);


/* USER LEFT */

socket.on(
 "user-left",
 id=>{

  const video =
   document.getElementById(
    "remote-"+id
   );

  if(video)
   video.remove();

  if(peers[id]){

   peers[id].close();

   delete peers[id];
  }
 }
);


/* FORCE MUTE */

socket.on(
 "force-mute",
 ()=>{

  if(!localStream)return;

  localStream
  .getAudioTracks()
  .forEach(track=>{
   track.enabled=false;
  });

  alert(
   "Adminiin microphone kee cufe."
  );
 }
);


/* REMOVED */

socket.on(
 "removed-from-room",
 ()=>{

  alert(
   "Ati room keessaa baafamte."
  );

  location.reload();
 }
);


/* =========================
   🎁 GIFT SYSTEM
   ========================= */

const giftPrices = {

 heart:10,
 flower:20,
 star:50,
 crown:100,
 diamond:500

};


function updateCoins(){

 const box =
  document.getElementById(
   "coinBalance"
  );

 if(box){
  box.innerText=coins;
 }
}


function sendGift(gift){

 if(!roomId){

  alert(
   "Gift erguuf dura room seeni."
  );

  return;
 }

 const price =
  giftPrices[gift] || 10;

 if(coins < price){

  alert(
   "Coins gahaa hin qabdu."
  );

  return;
 }

 coins -= price;

 updateCoins();

 socket.emit(
  "sendGift",
  {
   gift
  }
 );
}


socket.on(
 "giftReceived",
 data=>{

  const area =
   document.getElementById(
    "giftArea"
   );

  if(!area)return;

  const item =
   document.createElement(
    "div"
   );

  item.className=
   "gift-item";

  item.innerHTML =
   "🎁 <b>"+
   safe(data.sender)+
   "</b> Gift "+
   safe(data.emoji)+
   " erge — 🪙 "+
   data.coins;

  area.appendChild(item);

  setTimeout(
   ()=>{
    item.remove();
   },
   7000
  );

 }
);


/* =========================
   🎙️ VOICE CLUB
   ========================= */

function joinVoiceClub(){

 if(!roomId){

  alert(
   "Dura room seeni."
  );

  return;
 }

 voiceClubActive=true;

 socket.emit(
  "voice-club-join",
  {
   roomId,
   username
  }
 );

 document.getElementById(
  "voiceStatus"
 ).innerText =
 "Hojjechaa jira 🎙️";
}


function leaveVoiceClub(){

 voiceClubActive=false;

 document.getElementById(
  "voiceStatus"
 ).innerText =
 "Hin jalqabne";

 document.getElementById(
  "handStatus"
 ).innerText="";

}


socket.on(
 "voice-club-user-joined",
 data=>{

  const box =
   document.getElementById(
    "voiceStatus"
   );

  if(box){

   box.innerText =
    data.username+
    " Voice Club seene 🎙️";
  }
 }
);


/* RAISE HAND */

function raiseHand(){

 if(!voiceClubActive){

  alert(
   "Dura Voice Club seeni."
  );

  return;
 }

 socket.emit(
  "raise-hand"
 );
}


function lowerHand(){

 socket.emit(
  "lower-hand"
 );

 document.getElementById(
  "handStatus"
 ).innerText="";
}


socket.on(
 "hand-raised",
 data=>{

  document.getElementById(
   "handStatus"
  ).innerText =
   "✋ "+
   data.username+
   " harka kaaseera.";
 }
);


socket.on(
 "hand-lowered",
 data=>{

  if(
   data.socketId === socket.id
  ){

   document.getElementById(
    "handStatus"
   ).innerText="";
  }
 }
);


/* COPY ROOM */

function copyRoom(){

 navigator.clipboard
 .writeText(roomId);

 alert(
  "Room ID copied."
 );
}


/* SHARE ROOM */

async function shareRoom(){

 const link =
  location.origin+
  "?room="+
  roomId;

 if(navigator.share){

  try{

   await navigator.share({
    title:"Waliin-JM Room",
    text:
     "Room Waliin-JM seeni",
    url:link
   });

  }catch(e){}

 }else{

  navigator.clipboard
   .writeText(link);

  alert(
   "Room link copied."
  );
 }
}


/* DARK MODE */

function toggleDark(){

 document.body
 .classList
 .toggle("dark");

 localStorage.setItem(
  "dark",
  document.body.classList
  .contains("dark")
 );
}


if(
 localStorage.getItem("dark")
 ==="true"
){

 document.body
 .classList
 .add("dark");
}


/* CHANGE NAME */

function changeName(){

 const name =
  prompt(
   "Maqaa haaraa galchi:",
   username
  );

 if(name){

  username=name.trim();

  document.getElementById(
   "username"
  ).value=username;

  document.getElementById(
   "profileName"
  ).innerText=username;
 }
}


/* LEAVE */

function leaveRoom(){

 if(localStream){

  localStream
  .getTracks()
  .forEach(
   track=>track.stop()
  );
 }

 Object.values(peers)
 .forEach(
  pc=>pc.close()
 );

 peers={};

 location.reload();
}


/* SECURITY */

function safe(text){

 const div =
  document.createElement(
   "div"
  );

 div.textContent=text;

 return div.innerHTML;
}
